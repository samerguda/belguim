<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جدول الأعمال والعد التنازلي</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 20px;
            direction: rtl;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .countdown-box {
            background: linear-gradient(135deg, #2c3e50, #3498db);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 25px;
        }
        .countdown-title {
            font-size: 1.1rem;
            margin-bottom: 10px;
        }
        .timer {
            font-size: 1.8rem;
            font-weight: bold;
            letter-spacing: 1px;
            direction: ltr;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 14px 16px;
            text-align: right;
            border-bottom: 1px solid #e0e0e0;
        }
        th {
            background-color: #f8f9fa;
            color: #333;
            font-weight: bold;
        }
        tr:hover {
            background-color: #f1f5f9;
        }
        .badge {
            background-color: #e74c3c;
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>جدول الأعمال والتكليفات</h2>

    <!-- مربع العد التنازلي الديناميكي -->
    <div class="countdown-box">
        <div class="countdown-title">الوقت المتبقي على ميعاد العمل (سخون ماكن):</div>
        <div id="countdown" class="timer">جاري التحميل...</div>
    </div>

    <!-- جدول الأعمال -->
    <table>
        <thead>
            <tr>
                <th>طبيعة العمل</th>
                <th>اليوم والتاريخ</th>
                <th>الموعد</th>
                <th>الموقع</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><span class="badge">سخون ماكن</span></td>
                <td>الاثنين 12-10-2026</td>
                <td>02:30 مساءً</td>
                <td>الموقع المحدد للعمل</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    // موعد العمل: الاثنين 12 أكتوبر 2026 الساعة 14:30 (2:30 مساءً)
    const targetDate = new Date(2026, 9, 12, 14, 30, 0).getTime();

    function updateCountdown() {
        const now = new Date().getTime();
        const difference = targetDate - now;

        if (difference <= 0) {
            document.getElementById("countdown").innerText = "حان الآن موعد العمل!";
            return;
        }

        // حساب الأيام والساعات والدقائق والثواني
        const days = Math.floor(difference / (1000 * 60 * 60 * 24));
        const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((difference % (1000 * 60)) / 1000);

        // تنسيق العرض
        document.getElementById("countdown").innerText = 
            `${days} يوم - ${hours} ساعة - ${minutes} دقيقة - ${seconds} ثانية`;
    }

    // تشغيل العداد فوراً وتحديثه كل ثانية
    updateCountdown();
    setInterval(updateCountdown, 1000);
</script>

</body>
</html>
